[project]
name = "home-recipes"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sphinx (>=9.1.0,<10.0.0)",
    "tibas-tt (>=0.3.1,<0.4.0)",
    "sphinx-design (>=0.7.0,<0.8.0)"
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 119

[tool.isort]
force_grid_wrap = 2
multi_line_output = 3
include_trailing_comma = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
